title: '&a&l小游戏投票 &7| &e%player_name%'
rows: 6

# ⚠ layout 每行必须正好 9 格（rows: 6 → 6 行 × 9 格 = 54 格）。
#   多一格少一格都会让 TrMenu 错位或加载失败。
#   6 个小游戏摆成 2 行 × 3 列（彼此隔一格），下面放玩家信息 + 关闭。
layout:
  - '#########'
  - '##A#B#C##'
  - '##D#E#F##'
  - '#########'
  - '####I####'
  - '###G#H###'

events:
  open:
    - condition: ''
      actions:
        - 'sound: block.note_block.bit-2-2'

icons:
  '#':
    display:
      material: GRAY_STAINED_GLASS_PANE
      name: '&6&l小游戏投票'
      lore:
        - '&7点一个你想玩的小游戏，投出一票'
        - '&7满 &e%minigamevote_threshold% &7票自动开启'
        - '&7退出服务器后你投的票会作废'
    actions:
      all: []

  # ───────────────────────────────────────────────────────────────
  # 票数刷新现在由插件主动推送（[menu] auto-refresh = true），
  # 所以图标上不再需要 update: 20 那种定时轮询。
  # 装不上 TrMenu 接入时，再给每个图标加一行 update: 40 兜底。
  #
  # ⚠ 投票动作里必须是 'update' 而不是 'refresh'
  #   refresh 动作只重新筛选子图标（走 Icon.onRefresh），根本不重建
  #   物品；update 动作才是 onReset + settingItem，会真的重解析 lore。
  #   update 不带参数 = 刷新本菜单所有图标；带参数时是图标 id，
  #   用分号分隔 —— 注意它不认 '*' 这个通配符。
  # ───────────────────────────────────────────────────────────────
  A:
    display:
      material: PINK_WOOL
      name: '&b躲猫猫'
      lore:
        - '&7经典躲猫猫，躲好了别被发现'
        - ''
        - '&7当前票数：&e%minigamevote_votes_hide% &7/ &e%minigamevote_threshold%'
        - ''
        - '&a▶ 点击投票'
    actions:
      all:
        - 'player: votegame hide'
        - 'sound: entity.item.pickup'
        - 'update'

  B:
    display:
      material: TNT
      name: '&cTNTRun'
      lore:
        - '&7脚下的方块会消失，别停下'
        - ''
        - '&7当前票数：&e%minigamevote_votes_tntrun% &7/ &e%minigamevote_threshold%'
        - ''
        - '&a▶ 点击投票'
    actions:
      all:
        - 'player: votegame tntrun'
        - 'sound: entity.item.pickup'
        - 'update'

  C:
    display:
      material: RED_BED
      name: '&e起床战争'
      lore:
        - '&7拆床！守住自己的床'
        - ''
        - '&7当前票数：&e%minigamevote_votes_bedwars% &7/ &e%minigamevote_threshold%'
        - ''
        - '&a▶ 点击投票'
    actions:
      all:
        - 'player: votegame bedwars'
        - 'sound: entity.item.pickup'
        - 'update'

  D:
    display:
      material: IRON_SWORD
      name: '&a谁是杀手'
      lore:
        - '&7找出身边的杀手'
        - ''
        - '&7当前票数：&e%minigamevote_votes_murder% &7/ &e%minigamevote_threshold%'
        - ''
        - '&a▶ 点击投票'
    actions:
      all:
        - 'player: votegame murder'
        - 'sound: entity.item.pickup'
        - 'update'

  E:
    display:
      material: DIAMOND_BOOTS
      name: '&d跑酷'
      lore:
        - '&7跳就完事了'
        - ''
        - '&7当前票数：&e%minigamevote_votes_parkour% &7/ &e%minigamevote_threshold%'
        - ''
        - '&a▶ 点击投票'
    actions:
      all:
        - 'player: votegame parkour'
        - 'sound: entity.item.pickup'
        - 'update'

  F:
    display:
      material: DIAMOND_HOE
      name: '&6QUAKE'
      lore:
        - '&7一枪一个的枪战'
        - ''
        - '&7当前票数：&e%minigamevote_votes_quake% &7/ &e%minigamevote_threshold%'
        - ''
        - '&a▶ 点击投票'
    actions:
      all:
        - 'player: votegame quake'
        - 'sound: entity.item.pickup'
        - 'update'

  # 独立出来的「查看排行」按钮。之前这个动作挂在头像 I 上，
  # 点自己头像才看得到排行，藏得太深 —— 点这里直接看。
  # 先 close 再执行命令：菜单开着会把聊天顶掉，排行有
  # 表头 + 每个游戏一行，不关菜单看不全。
  G:
    display:
      material: PAPER
      name: '&e&l查看投票排行'
      lore:
        - '&7当前领先：&e%minigamevote_leading%'
        - '&7已投票人数：&e%minigamevote_total%'
        - '&7你投给了：&f%minigamevote_mine%'
        - ''
        - '&a▶ 点击查看完整排行'
    actions:
      all:
        - 'close'
        - 'player: votegame stats'
        - 'sound: entity.item.pickup'

  # 头像只做展示，不再兼职输出排行（排行看上面的 G）
  I:
    display:
      material: 'head:%player_name%'
      name: '&b%player_name% &6的投票'
      lore:
        - '&7你当前投给：&f%minigamevote_mine%'
        - '&7可以改票，换一个就会自动取消上一票'
        - '&7退出服务器即作废'
        - ''
        - '&7当前最多票：&e%minigamevote_leading%'
        - '&7已投票人数：&e%minigamevote_total%'
    actions:
      all: []

  H:
    display:
      material: BARRIER
      name: '&c关闭菜单'
    actions:
      all:
        - 'close'
