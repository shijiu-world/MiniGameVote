# ═══════════════════════════════════════════════════════════════════════════
#  MiniGameVote · 大厅小游戏投票
#  改完执行 /votegameadmin reload（⚠ reload 会清空当前票数）
#
#  上线前必填 3 处
#    1. [mcsm]    url / daemon-id / apikey      —— 面板在哪、怎么认证
#    2. [games.*] uuid                          —— 每个小游戏对应哪个面板实例
#    3. threshold                               —— 几票开服
#
#  改完用这两条命令核对
#    /votegameadmin mcsm   面板地址、实例对应关系、拼好的请求地址（apikey 打码）
#    /votegameadmin env    环境变量读到了没（只显示名字，不显示值）
#
#  语法：字符串用 "..." 或 '...'，# 后面是注释，数组用 [ ... ]
#  变量：${env:XXX} = 系统环境变量（放密钥用），${env:XXX:-兜底值} 没设置时用兜底值
#        环境变量要在开服脚本里 export 再启动服务端，改完要重启服务端（reload 不重读环境）
# ═══════════════════════════════════════════════════════════════════════════

# ───────────────────────────────── 基本 ─────────────────────────────────────

threshold = 5                 # 达到多少票触发开服流程

progress-audience = "voters"  # 每投一票播报给谁
                              #   voters  只发给已经投过票的玩家（默认）
                              #   all     全服广播
                              #   none    不播报
                              # （投票者本人收到的是 vote-success 确认，不重复发）

# ──────────────────────────────── MCSManager ────────────────────────────────
#  一个小游戏 = 面板上一个实例。达标后：
#    查所有小游戏实例的状态 → 有任何一个在跑就作废本轮 → 全都停着才启动票数最高的那个
#
#  对接的接口（当前版本面板，路径与认证方式写死在插件里，不提供配置）
#    启动实例  GET /api/protected_instance/open?uuid=<实例>&daemonId=<守护>
#    查状态    GET /api/instance?uuid=<实例>&daemonId=<守护>   （每个小游戏查一次）
#    认证      Authorization: Bearer <apikey>
#    状态码    -1 忙碌 / 0 停止 / 1 停止中 / 2 启动中 / 3 运行中
# ────────────────────────────────────────────────────────────────────────────

[mcsm]
enabled = true                # false = 只计票不联网（调试用）

url = "http://mc.com"                             # 面板地址，结尾别带斜杠
daemon-id = "xxx"                                 # 守护进程 uuid ⚠ 上线前用 /votegameadmin test 核对
apikey = "${env:MCSM_KEY}"                        # 🔐 api-key，走环境变量；取不到会后台告警并当作空

busy-status = [2, 3]          # 哪些状态码算「有小游戏在跑」→ 有就作废本轮
on-query-error = "idle"       # 查不到时：idle 当空闲继续开 / busy 当占用作废（更保守）
watch = []                    # 除小游戏外，还有哪些实例在跑也算占用；一般留空


# ───────────────────────────────── 小游戏 ───────────────────────────────────
#  每节一个小游戏，节名 [games.<id>] 里的 id 就是 /votegame <id> 用的那个
#    name      显示名，支持 & 颜色码
#    uuid      面板实例 uuid（必填）— 面板 → 打开实例 → 地址栏那串 32 位十六进制
#    daemon-id 可选，该实例不在 [mcsm] 的默认守护上时才写
# ────────────────────────────────────────────────────────────────────────────

[games.hide]
name = "&b躲猫猫"
uuid = "实例uuid"

[games.tntrun]
name = "&cTNTRun"
uuid = "实例uuid"

[games.bedwars]
name = "&e起床战争"
uuid = "实例uuid"

[games.murder]
name = "&a谁是杀手"
uuid = "实例uuid"

[games.parkour]
name = "&d跑酷"
uuid = "实例uuid"

[games.quake]
name = "&6QUAKE"
uuid = "实例uuid"

# ───────────────────────────────── 网络 ─────────────────────────────────────

[http]
timeout-ms = 3000                                # 单个请求超时（毫秒）
user-agent = "NineteenWorld-MiniGameVote"

# ───────────────────────────────── 菜单 ─────────────────────────────────────

[menu]
enabled = true                                   # false = 不给任何人开菜单
open-command = "trm open minigamevote %player%"  # /votegame 不带参数时由控制台执行这条
reopen-after-vote = true                         # 投完票重开菜单，用来刷新票数

# ───────────────────────────────── 音效 ─────────────────────────────────────

[sounds]
vote = "ENTITY_PLAYER_LEVELUP"   # 投票成功（Bukkit 声音枚举名，填错就静音）
denied = "ENTITY_VILLAGER_NO"    # 已投过 / 没权限

# ───────────────────────────────── 文案 ─────────────────────────────────────
#  支持 & 颜色码。可用变量：
#    %game% 小游戏名    %id% 小游戏 id    %votes% 当前票数   %threshold% 阈值
#    %player% 玩家名    %total% 投票人数   %code% HTTP 状态码  %detail% 占用实例
#    %old%   改票前投的那个小游戏（只在 vote-changed 里有）
#    %rank%  名次（从 1 起，只在 stats-line 里有；票数降序，同票按配置顺序）
# ────────────────────────────────────────────────────────────────────────────

[messages]
prefix = "&6[小游戏投票] &r"

vote-success = "&a你投给了 &f%game% &a（%votes%/%threshold%）"
# 已经投过的再投别的 → 改票，上一票自动取消；%old% 是他原来投的那个
vote-changed = "&a你改投给了 &f%game% &a（%votes%/%threshold%），原 &7%old%&a 的一票已取消"
already-voted = "&c你当前已经投给 &f%game%&c 了，换一个就自动改票"
unknown-game = "&c未知的小游戏：&f%id%"
progress = "&7%player% &f投给了 &e%game% &7（%votes%/%threshold%）"
progress-changed = "&7%player% &f改投给了 &e%game% &7（%votes%/%threshold%）"
no-permission = "&c你没有投票权限"
usage = "&7用法：&a/votegame &7打开菜单，&a/votegame <id> &7直接投票"

stats-header = "&6========== 小游戏投票 =========="
# 按票数降序输出，同票按配置里的先后顺序；不想要名次就把 #%rank% 删掉
stats-line = "&7#%rank% &f%game% &7：&e%votes%&7/&e%threshold%"
stats-total = "&7已投票人数：&e%total%"
stats-none = "&7还没有人投票"

threshold-reached = "&f%game% &e达到 &c%threshold% &e票，正在开启…（HTTP %code%）"
open-failed = "&f%game% &e达到 &c%threshold% &e票，但开启请求失败（HTTP %code%），票数已重置"
busy = "&c已经有小游戏正在进行中（%detail%），本轮投票作废，票数已重置！"
no-uuid = "&f%game% &e达到 &c%threshold% &e票，但该小游戏没配实例 uuid（或 MCSM 已关闭），仅重置票数"

reset = "&a已重置所有票数与投票记录"
reloaded = "&a配置已重载（票数已清空）"
threshold-set = "&a当前阈值：&e%threshold%"
opened-menu = "&a已为 &f%player% &a打开投票菜单"
test-result = "&7状态码：&e%code% &7(ok=%ok%)"
test-body = "&7响应：&f%body%"
